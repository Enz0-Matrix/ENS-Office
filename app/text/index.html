<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Документ1 — ENS-Text</title>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <span class="app-mark" data-tauri-drag-region>ENS</span>
    <span class="quick-access">
      <button id="qa-save" class="qa" title="Сохранить (Ctrl+S)" aria-label="Сохранить"></button>
      <button id="qa-print" class="qa" title="Печать (Ctrl+P)" aria-label="Печать"></button>
      <button id="qa-undo" class="qa" title="Отменить (Ctrl+Z)" aria-label="Отменить"></button>
      <button id="qa-redo" class="qa" title="Повторить (Ctrl+Y)" aria-label="Повторить"></button>
    </span>
    <span id="doc-name" class="doc-name" data-tauri-drag-region></span>
    <label class="search"><input id="search" placeholder="Поиск команд (Alt+Q)" autocomplete="off"></label>
    <div id="window-buttons" class="window-buttons" hidden>
      <button data-win="minimize" title="Свернуть" aria-label="Свернуть"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button data-win="maximize" title="Развернуть" aria-label="Развернуть"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
      <button data-win="close" class="close" title="Закрыть" aria-label="Закрыть"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <section id="ribbon" class="ribbon"></section>
  <div id="notice" class="notice" hidden></div>
  <div id="findbar" class="findbar" hidden></div>
  <main id="desk" class="desk"><div id="sheet-wrap" class="sheet-wrap"><div id="sheet" class="sheet"><div id="papers" class="papers"></div></div></div></main>
  <footer>
    <div class="statusbar"><span><span id="status-saved"></span><span id="status-page"></span>  ·  <span id="status-words"></span></span><span class="status-right"><span id="status-sel"></span>
      <span class="zoom-box"><button id="zoom-out" title="Уменьшить масштаб" aria-label="Уменьшить масштаб">−</button><button id="zoom-val" title="Масштаб (щелчок — 100%)">100%</button><button id="zoom-in" title="Увеличить масштаб" aria-label="Увеличить масштаб">+</button></span></span></div>
  </footer>
  <div id="toast" class="toast" hidden></div>
  <div id="dialog" class="overlay" hidden></div>
  <input id="file-input" type="file" accept=".docx" hidden>
  <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/svg+xml" hidden>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
