[package]
name = "ens-text"
version = "0.0.1"
description = "ENS-Tekst — текстовый редактор ENS-Office"
edition = "2021"
publish = false

[lib]
name = "ens_text_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Команды Tauri. Версия для РЕД ОС 7 (app/text/redos7) берёт files.rs и
# recovery.rs без этой возможности — только общие функции.
default = ["tauri-shell"]
tauri-shell = []

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-clipboard-manager = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
