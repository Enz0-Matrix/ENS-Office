[package]
name = "ens-table-redos7"
version = "1.4.1"
description = "ENS-Table для РЕД ОС 7: окно Chromium в режиме приложения и помощник для файлов и восстановления"
edition = "2021"
publish = false

# Файлы и восстановление — тот же код, что в настольной версии
# (src-tauri/src/files.rs и recovery.rs), без команд Tauri.

[[bin]]
name = "ens-table-r7"
path = "src/main.rs"

[features]
# Объявлена только для общего кода files.rs/recovery.rs; здесь всегда выключена.
tauri-shell = []

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
