# Проверка и сборка ENS-Office на серверах GitHub.
# Готовые сборки — во вкладке Actions → запуск → Artifacts:
#   ens-table-linux   — AppImage (без установки), rpm (РЕД ОС, Альт, Fedora), deb
#   ens-table-windows — установщик NSIS и exe
#   ens-text-linux / ens-text-windows — то же для ENS-Text (плюс ens-text-r7 для РЕД ОС 7)
name: CI

on:
  # Ветки проверяются через pull request; push — только для main.
  push:
    branches: [main]
    # Тег vX.Y.Z — выпуск ENS-Table, тег text-vX.Y.Z — выпуск ENS-Text (см. задания release и release-text).
    tags: ['v*', 'text-v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Тесты движка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/ironcalc
      - name: Все тесты IronCalc
        working-directory: core/ironcalc
        run: cargo test --lib -p ironcalc_base
      - name: Частичный пересчёт со сверкой с полным (ENS_VERIFY_INCREMENTAL)
        working-directory: core/ironcalc
        run: ENS_VERIFY_INCREMENTAL=1 cargo test --lib -p ironcalc_base
      - name: Чтение и запись xlsx (настоящие файлы Excel)
        working-directory: core/ironcalc
        run: cargo test -p ironcalc --lib --tests

  desktop:
    name: Сборка ${{ matrix.name }}
    needs: engine
    # Тег text-v* — выпуск ENS-Text: сборки ENS-Table для него не нужны.
    if: ${{ !startsWith(github.ref, 'refs/tags/text-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,rpm,deb
          - name: windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Библиотеки Linux для окна (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/ironcalc -> target
            app/table/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/table/package-lock.json
      - name: Зависимости интерфейса
        working-directory: app/table
        run: npm ci
      - name: Движок в WebAssembly
        working-directory: app/table
        shell: bash
        run: npm run engine
      - name: Проверка типов
        working-directory: app/table
        run: npm run check
      - name: Тесты оболочки
        working-directory: app/table/src-tauri
        run: cargo test --release
      - name: Сборка приложения
        working-directory: app/table
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Версия для браузера одним файлом (для старых систем)
        if: matrix.name == 'linux'
        working-directory: app/table
        run: ENS_SINGLE=1 npx vite build && node scripts/build-single.mjs
      - name: Инструменты сборки под старую glibc (РЕД ОС 7)
        if: matrix.name == 'linux'
        run: |
          pip install ziglang
          sudo apt-get install -y rpm
      - uses: taiki-e/install-action@v2
        if: matrix.name == 'linux'
        with:
          tool: cargo-zigbuild
      - name: ENS-Table для РЕД ОС 7 (glibc 2.17+, окно Chromium)
        if: matrix.name == 'linux'
        working-directory: app/table
        run: |
          ver=$(node -p "require('./package.json').version")
          (cd redos7 && cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17)
          bin=redos7/target/x86_64-unknown-linux-gnu/release/ens-table-r7
          echo "Самая новая нужная версия glibc:"; objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          root="$RUNNER_TEMP/ENS-Table-redos7"
          mkdir -p "$root"
          cp "$bin" "$root/"
          cp -r dist "$root/ui"
          cp redos7/packaging/ens-table-r7.desktop redos7/packaging/install-user.sh "$root/"
          cp src-tauri/icons/128x128.png "$root/ens-table-r7.png"
          mkdir -p redos7-out
          tar -C "$RUNNER_TEMP" -czf "redos7-out/ENS-Table_${ver}_redos7.tar.gz" ENS-Table-redos7
          rpmbuild -bb redos7/packaging/ens-table-r7.spec --define "_ensroot $root" --define "ens_version $ver"             --define "_rpmdir $PWD/redos7-out" --define "_build_id_links none"
          find redos7-out -name '*.rpm' -exec mv {} redos7-out/ \;
          ls -la redos7-out
      - uses: actions/upload-artifact@v4
        with:
          name: ens-table-${{ matrix.name }}
          path: |
            app/table/src-tauri/target/release/bundle/**/*.AppImage
            app/table/src-tauri/target/release/bundle/**/*.rpm
            app/table/src-tauri/target/release/bundle/**/*.deb
            app/table/src-tauri/target/release/bundle/**/*.exe
            app/table/src-tauri/target/release/ens-table.exe
            app/table/dist-single/ENS-Table_*_browser.html
            app/table/redos7-out/*.rpm
            app/table/redos7-out/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  text:
    name: ENS-Text (типы, сборка, тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/table/package-lock.json
            app/text/package-lock.json
      - name: Зависимости (общий код лежит в app/table)
        run: |
          (cd app/table && npm ci)
          (cd app/text && npm ci)
      - name: Проверка типов
        working-directory: app/text
        run: npm run check
      - name: Сборка
        working-directory: app/text
        run: npm run build
      - name: Chromium для проверок
        working-directory: app/text
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Утилиты для проверок (pdfinfo — число страниц PDF, python-docx — чтение сохранённых файлов)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install python-docx
      - name: Проверки в браузере
        working-directory: app/text
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/text/redos7 -> target
            app/table/redos7 -> target
      - name: "Помощник РЕД ОС 7 (ENS-Table и ENS-Text) собирается"
        run: |
          (cd app/table/redos7 && cargo check)
          (cd app/text/redos7 && cargo check)
      - name: Настоящие файлы и восстановление (помощник РЕД ОС 7 + интерфейс в Chromium)
        working-directory: app/text
        run: npm run test:desktop

  desktop-text:
    name: Сборка ENS-Text ${{ matrix.name }}
    needs: text
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,rpm,deb
          - name: windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Библиотеки Linux для окна (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/text/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/table/package-lock.json
            app/text/package-lock.json
      - name: Зависимости интерфейса (общий код лежит в app/table)
        shell: bash
        run: |
          (cd app/table && npm ci)
          (cd app/text && npm ci)
      - name: Проверка типов
        working-directory: app/text
        run: npm run check
      - name: Тесты оболочки (общий код файлов и восстановления)
        working-directory: app/text/src-tauri
        run: cargo test --release
      - name: Сборка приложения
        working-directory: app/text
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Инструменты сборки под старую glibc (РЕД ОС 7)
        if: matrix.name == 'linux'
        run: |
          pip install ziglang
          sudo apt-get install -y rpm
      - uses: taiki-e/install-action@v2
        if: matrix.name == 'linux'
        with:
          tool: cargo-zigbuild
      - name: ENS-Text для РЕД ОС 7 (glibc 2.17+, окно Chromium)
        if: matrix.name == 'linux'
        working-directory: app/text
        run: |
          ver=$(node -p "require('./package.json').version")
          (cd redos7 && cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17)
          bin=redos7/target/x86_64-unknown-linux-gnu/release/ens-text-r7
          echo "Самая новая нужная версия glibc:"; objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          root="$RUNNER_TEMP/ENS-Text-redos7"
          mkdir -p "$root"
          cp "$bin" "$root/"
          cp -r dist "$root/ui"
          cp redos7/packaging/ens-text-r7.desktop redos7/packaging/install-user.sh "$root/"
          cp src-tauri/icons/128x128.png "$root/ens-text-r7.png"
          mkdir -p redos7-out
          tar -C "$RUNNER_TEMP" -czf "redos7-out/ENS-Text_${ver}_redos7.tar.gz" ENS-Text-redos7
          rpmbuild -bb redos7/packaging/ens-text-r7.spec --define "_ensroot $root" --define "ens_version $ver" --define "_rpmdir $PWD/redos7-out" --define "_build_id_links none"
          find redos7-out -name '*.rpm' -exec mv {} redos7-out/ \;
          ls -la redos7-out
      - uses: actions/upload-artifact@v4
        with:
          name: ens-text-${{ matrix.name }}
          path: |
            app/text/src-tauri/target/release/bundle/**/*.AppImage
            app/text/src-tauri/target/release/bundle/**/*.rpm
            app/text/src-tauri/target/release/bundle/**/*.deb
            app/text/src-tauri/target/release/bundle/**/*.exe
            app/text/src-tauri/target/release/ens-text.exe
            app/text/redos7-out/*.rpm
            app/text/redos7-out/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Выпуск на GitHub
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ens-table-*
          path: artifacts
      - name: Собрать файлы выпуска и контрольные суммы
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*_browser.html' -o -name '*-setup.exe' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Создать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$tag" >/dev/null 2>&1; then
            # Выпуск уже создан вручную на странице Releases: добавляем файлы и заметки.
            gh release upload "$tag" release/* --clobber
            [ "$notes" = /dev/null ] || gh release edit "$tag" --title "ENS-Table ${tag#v}" --notes-file "$notes"
          else
            gh release create "$tag" release/* --title "ENS-Table ${tag#v}" --notes-file "$notes" --verify-tag
          fi

  release-text:
    name: Выпуск ENS-Text на GitHub
    needs: desktop-text
    if: startsWith(github.ref, 'refs/tags/text-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ens-text-*
          path: artifacts
      - name: Собрать файлы выпуска и контрольные суммы
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*-setup.exe' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Создать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#text-v}"
          notes="docs/releases/${tag}.md"
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            [ "$notes" = /dev/null ] || gh release edit "$tag" --title "ENS-Text $ver" --notes-file "$notes"
          else
            gh release create "$tag" release/* --title "ENS-Text $ver" --notes-file "$notes" --verify-tag --prerelease
          fi
